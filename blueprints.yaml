                            admin.providers.generic.userdata_login:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_LOGIN
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: preferred_username

                            admin.providers.generic.userdata_fullname:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_FULLNAME
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: name

                            admin.providers.generic.userdata_email:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: email

                            admin.providers.generic.userdata_email_verified:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL_VERIFIED
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL_VERIFIED_HELP
                              placeholder: email_verified

                            admin.providers.generic.userdata_picture:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_PICTURE
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_PICTURE_HELP
                              placeholder: picture

                            admin.providers.generic.userdata_groups:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_GROUPS
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_GROUPS_HELP
                              placeholder: groups

                providers.generic.description:
                  type: display
                  style: vertical
                  content: '[<i class="fa fa-book"></i> Generic OAuth2 Provider from the official documentation](https://oauth2-client.thephpleague.com/usage/?target=_blank)'
                  markdown: true

            github:
              type: fieldset
              title: GitHub
              collapsible: true

              fields:

                github_columns:
                  type: columns

                  fields:

                    github_column_left:
                      type: column

                      fields:

                        github.site:
                          type: display
                          style: vertical
                          content: '<h3>Site</h3>'

                        providers.github.enabled:
                          type: toggle
                          label: Enabled
                          highlight: 1
                          default: 0
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        providers.github.client_id:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_ID

                        providers.github.client_secret:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_SECRET

                        providers.github.options.scope:
                          type: selectize
                          size: large
                          label: PLUGIN_LOGIN_OAUTH2.SCOPE
                          classes: fancy
                          validate:
                            type: commalist

                    github_column_right:
                      type: column

                      fields:

                        github.admin:
                          type: display
                          style: vertical
                          content: '<h3>Admin</h3>'

                        admin.providers.github.enabled:
                          type: toggle
                          label: Enabled
                          highlight: 1
                          default: 0
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        admin.providers.github.client_id:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_ID

                        admin.providers.github.client_secret:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_SECRET

                        admin.providers.github.options.scope:
                          type: selectize
                          size: large
                          label: PLUGIN_LOGIN_OAUTH2.SCOPE
                          classes: fancy
                          validate:
                            type: commalist

                providers.github.description:
                  type: display
                  style: vertical
                  content: '[<i class="fa fa-book"></i> GitHub OAuth2 from the official documentation](https://developer.github.com/apps/building-oauth-apps/creating-an-oauth-app/?target=_blank)'
                  markdown: true


            instagram:
              type: fieldset
              title: Instagram
              collapsible: true

              fields:

                instagram_columns:
                  type: columns

                  fields:

                    instagram_column_left:
                      type: column

                      fields:

                        instagram.site:
                          type: display
                          style: vertical
                          content: '<h3>Site</h3>'

                        providers.instagram.enabled:
                          type: toggle
                          label: Enabled
                          highlight: 1
                          default: 0
