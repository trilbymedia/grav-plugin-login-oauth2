                          placeholder: https://idp.example.com/userinfo

                        admin.providers.generic.enforce_email_verified:
                          type: toggle
                          label: PLUGIN_LOGIN_OAUTH2.ENFORCE_EMAIL_VERIFIED
                          highlight: 1
                          default: 1
                          help: PLUGIN_LOGIN_OAUTH2.ENFORCE_EMAIL_VERIFIED_HELP
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        generic_avatar_right:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.AVATAR
                          text: PLUGIN_LOGIN_OAUTH2.AVATAR_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            admin.providers.generic.avatar_from_picture:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.AVATAR_FROM_PICTURE
                              highlight: 1
                              default: 1
                              help: PLUGIN_LOGIN_OAUTH2.AVATAR_FROM_PICTURE_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                        generic_groups_right:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC
                          text: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            generic.admin_group_sync_notice:
                              type: conditional
                              data-condition@: ['Grav\Plugin\Login\OAuth2\OAuth2::adminSaveGravUserCondition']
                              fields:

                                generic.admin_group_sync_needs_save:
                                  type: display
                                  style: vertical
                                  content: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_NEEDS_SAVE

                            admin.providers.generic.group_sync:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_ENABLED
                              highlight: 1
                              default: 0
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_ENABLED_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                            admin.providers.generic.group_filter:
                              type: selectize
                              size: large
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_FILTER
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_FILTER_HELP
                              classes: fancy
                              validate:
                                type: commalist

                            admin.providers.generic.group_prefix:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_PREFIX
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_PREFIX_HELP

                            admin.providers.generic.group_autocreate:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_AUTOCREATE
                              highlight: 1
                              default: 0
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_AUTOCREATE_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                        generic_advanced_right:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.ADVANCED
                          text: PLUGIN_LOGIN_OAUTH2.ADVANCED_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            admin.providers.generic.options.scope:
                              type: selectize
                              size: large
                              label: PLUGIN_LOGIN_OAUTH2.SCOPE
                              classes: fancy
                              validate:
                                type: commalist

                            admin.providers.generic.options.scope_separator:
                              type: select
                              label: PLUGIN_LOGIN_OAUTH2.SCOPE_SEPARATOR
                              help: PLUGIN_LOGIN_OAUTH2.SCOPE_SEPARATOR_HELP
                              default: space
                              size: medium
                              options:
                                space: Space
                                comma: Comma

                            admin.providers.generic.options.pkce_method:
