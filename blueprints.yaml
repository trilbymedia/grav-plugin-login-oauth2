                          label: PLUGIN_LOGIN_OAUTH2.URL_AUTHORIZE
                          placeholder: https://idp.example.com/authorize

                        admin.providers.generic.token_endpoint:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.URL_ACCESS_TOKEN
                          placeholder: https://idp.example.com/token

                        admin.providers.generic.userinfo_endpoint:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.URL_RESOURCE_OWNER_DETAILS
