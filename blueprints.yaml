name: Login OAuth2
type: login-oauth2
slug: form
version: 2.3.0
description: OAuth2 Client Plugin to integrate with Grav's Login
icon: plug
author:
  name: Trilby Media, LLC
  email: hello@trilby.media
homepage: https://trilby.media
keywords: grav, plugin, oauth2, login, social
bugs: https://github.com/trilbymedia/grav-plugin-login-oauth2/issues
docs: https://github.com/trilbymedia/grav-plugin-login-oauth2/blob/develop/README.md
license: MIT
compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: login, version: '>=3.4' }

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: Plugin Status
      highlight: 1
      default: 0
      options:
        1: Enabled
        0: Disabled
      validate:
        type: bool

    oauth2_tabs:
      type: tabs

      fields:

        tab_1:
          type: tab
          title: PLUGIN_LOGIN_OAUTH2.GENERAL
          fields:

            callbacks_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_CALLBACKS
              text: PLUGIN_LOGIN_OAUTH2.SECTION_CALLBACKS_DESC
              underline: true

            site_callback_url:
              type: text
              disabled: true
              copy_to_clipboard: true
              label: PLUGIN_LOGIN_OAUTH2.SITE_CALLBACK_URI
              help: PLUGIN_LOGIN_OAUTH2.SITE_CALLBACK_URI_HELP
              data-default@: ['Grav\Plugin\Login\OAuth2\Providers\BaseProvider::getCallbackUri', false]

            admin_callback_url:
              type: text
              disabled: true
              copy_to_clipboard: true
              label: PLUGIN_LOGIN_OAUTH2.ADMIN_CALLBACK_URI
              help: PLUGIN_LOGIN_OAUTH2.ADMIN_CALLBACK_URI_HELP
              data-default@: ['Grav\Plugin\Login\OAuth2\Providers\BaseProvider::getCallbackUri', true]

            users_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_USERS
              text: PLUGIN_LOGIN_OAUTH2.SECTION_USERS_SHARED_DESC
              underline: true

            store_provider_data:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.STORE_OAUTH2_USER
              help: PLUGIN_LOGIN_OAUTH2.STORE_OAUTH2_USER_DESC
              highlight: 1
              default: 1
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            defaults_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_DEFAULTS
              text: PLUGIN_LOGIN_OAUTH2.SECTION_DEFAULTS_DESC
              underline: true

            default_access_levels.access:
              type: textarea
              label: PLUGIN_LOGIN_OAUTH2.DEFAULT_ACCESS_LEVELS
              help: PLUGIN_LOGIN_OAUTH2.DEFAULT_ACCESS_LEVELS_HELP
              markdown: true
              description: PLUGIN_LOGIN_OAUTH2.DEFAULT_ACCESS_LEVELS_DESC
              yaml: true
              size: large
              validate:
                required: true

            default_groups:
              type: selectize
              size: large
              placeholder: "e.g. administrators, publishers"
              label: PLUGIN_LOGIN_OAUTH2.DEFAULT_GROUPS
              help: PLUGIN_LOGIN_OAUTH2.DEFAULT_GROUPS_HELP
              classes: fancy
              validate:
                type: commalist

            troubleshooting_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_TROUBLESHOOTING
              underline: true

            debug:
              type: toggle
              label: Extra Debugging
              help: PLUGIN_LOGIN_OAUTH2.DEBUG_HELP
              highlight: 0
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

        tab_site:
          type: tab
          title: PLUGIN_LOGIN_OAUTH2.SITE

          fields:

            site_users_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_USERS
              underline: true

            require_grav_user:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.REQUIRE_GRAV_USER
              help: PLUGIN_LOGIN_OAUTH2.REQUIRE_GRAV_USER_DESC
              highlight: 0
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            save_grav_user:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.SAVE_GRAV_USER
              help: PLUGIN_LOGIN_OAUTH2.SAVE_GRAV_USER_DESC
              highlight: 0
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            buttons_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_BUTTONS
              underline: true

            built_in_css:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.BUILTIN_CSS
              highlight: 1
              default: 1
              help: PLUGIN_LOGIN_OAUTH2.BUILTIN_CSS_HELP
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            button_style:
              type: select
              label: PLUGIN_LOGIN_OAUTH2.BUTTON_STYLE
              default: row
              size: medium
              help: PLUGIN_LOGIN_OAUTH2.BUTTON_STYLE_HELP
              options:
                row: Horizontal Row
                square: Square Block

        tab_admin:
          type: tab
          title: PLUGIN_LOGIN_OAUTH2.ADMIN

          fields:

            admin_login_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_ADMIN_LOGIN
              underline: true

            admin.enabled:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.ADMIN_ENABLED
              help: PLUGIN_LOGIN_OAUTH2.ADMIN_ENABLED_HELP
              highlight: 0
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            admin_users_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_USERS
              underline: true

            admin.require_grav_user:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.ADMIN_REQUIRE_GRAV_USER
              help: PLUGIN_LOGIN_OAUTH2.ADMIN_REQUIRE_GRAV_USER_HELP
              highlight: 0
              config-default@: plugins.login-oauth2.require_grav_user
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            admin.save_grav_user:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.ADMIN_SAVE_GRAV_USER
              help: PLUGIN_LOGIN_OAUTH2.ADMIN_SAVE_GRAV_USER_HELP
              highlight: 0
              config-default@: plugins.login-oauth2.save_grav_user
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool

            admin_buttons_section:
              type: section
              title: PLUGIN_LOGIN_OAUTH2.SECTION_BUTTONS
              text: PLUGIN_LOGIN_OAUTH2.SECTION_ADMIN_BUTTONS_DESC
              underline: true

            admin.built_in_css:
              type: toggle
              label: PLUGIN_LOGIN_OAUTH2.BUILTIN_CSS
              highlight: 1
              default: 1
              help: PLUGIN_LOGIN_OAUTH2.BUILTIN_CSS_HELP
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool

            admin.button_style:
              type: select
              label: PLUGIN_LOGIN_OAUTH2.BUTTON_STYLE
              default: row
              size: medium
              help: PLUGIN_LOGIN_OAUTH2.ADMIN_BUTTON_STYLE_HELP
              options:
                row: Horizontal Row
                square: Square Block

        tab_2:
          type: tab
          title: PLUGIN_LOGIN_OAUTH2.PROVIDERS

          fields:

            generic:
              type: fieldset
              title: Generic
              collapsible: true

              fields:

                generic_columns:
                  type: columns

                  fields:

                    generic_column_left:
                      type: column

                      fields:

                        generic.site:
                          type: display
                          style: vertical
                          content: '<h3>Site</h3>'

                        providers.generic.enabled:
                          type: toggle
                          label: Enabled
                          highlight: 1
                          default: 0
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        providers.generic.label:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.LABEL
                          help: PLUGIN_LOGIN_OAUTH2.LABEL_HELP

                        providers.generic.client_id:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_ID

                        providers.generic.client_secret:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_SECRET

                        providers.generic.authorization_endpoint:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.URL_AUTHORIZE
                          placeholder: https://idp.example.com/authorize

                        providers.generic.token_endpoint:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.URL_ACCESS_TOKEN
                          placeholder: https://idp.example.com/token

                        providers.generic.userinfo_endpoint:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.URL_RESOURCE_OWNER_DETAILS
                          help: PLUGIN_LOGIN_OAUTH2.URL_RESOURCE_OWNER_DETAILS_HELP
                          placeholder: https://idp.example.com/userinfo

                        providers.generic.enforce_email_verified:
                          type: toggle
                          label: PLUGIN_LOGIN_OAUTH2.ENFORCE_EMAIL_VERIFIED
                          highlight: 1
                          default: 1
                          help: PLUGIN_LOGIN_OAUTH2.ENFORCE_EMAIL_VERIFIED_HELP
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        generic_avatar_left:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.AVATAR
                          text: PLUGIN_LOGIN_OAUTH2.AVATAR_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            providers.generic.avatar_from_picture:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.AVATAR_FROM_PICTURE
                              highlight: 1
                              default: 1
                              help: PLUGIN_LOGIN_OAUTH2.AVATAR_FROM_PICTURE_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                        generic_groups_left:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC
                          text: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            providers.generic.group_sync:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_ENABLED
                              highlight: 1
                              default: 0
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_SYNC_ENABLED_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                            providers.generic.group_filter:
                              type: selectize
                              size: large
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_FILTER
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_FILTER_HELP
                              classes: fancy
                              validate:
                                type: commalist

                            providers.generic.group_prefix:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_PREFIX
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_PREFIX_HELP

                            providers.generic.group_autocreate:
                              type: toggle
                              label: PLUGIN_LOGIN_OAUTH2.GROUP_AUTOCREATE
                              highlight: 1
                              default: 0
                              help: PLUGIN_LOGIN_OAUTH2.GROUP_AUTOCREATE_HELP
                              options:
                                1: Enabled
                                0: Disabled
                              validate:
                                type: bool

                        generic_advanced_left:
                          type: fieldset
                          title: PLUGIN_LOGIN_OAUTH2.ADVANCED
                          text: PLUGIN_LOGIN_OAUTH2.ADVANCED_DESC
                          collapsible: true
                          collapsed: true

                          fields:

                            providers.generic.options.scope:
                              type: selectize
                              size: large
                              label: PLUGIN_LOGIN_OAUTH2.SCOPE
                              classes: fancy
                              validate:
                                type: commalist

                            providers.generic.options.scope_separator:
                              type: select
                              label: PLUGIN_LOGIN_OAUTH2.SCOPE_SEPARATOR
                              help: PLUGIN_LOGIN_OAUTH2.SCOPE_SEPARATOR_HELP
                              default: space
                              size: medium
                              options:
                                space: Space
                                comma: Comma

                            providers.generic.options.pkce_method:
                              type: select
                              label: PLUGIN_LOGIN_OAUTH2.PKCE_METHOD
                              help: PLUGIN_LOGIN_OAUTH2.PKCE_METHOD_HELP
                              default: S256
                              size: medium
                              options:
                                '': Disabled
                                S256: S256 (recommended)
                                plain: plain (not recommended)

                            providers.generic.userdata_id:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_ID
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_ID_HELP
                              placeholder: sub

                            providers.generic.userdata_login:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_LOGIN
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: preferred_username

                            providers.generic.userdata_fullname:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_FULLNAME
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: name

                            providers.generic.userdata_email:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_HELP
                              placeholder: email

                            providers.generic.userdata_email_verified:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL_VERIFIED
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_EMAIL_VERIFIED_HELP
                              placeholder: email_verified

                            providers.generic.userdata_picture:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_PICTURE
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_PICTURE_HELP
                              placeholder: picture

                            providers.generic.userdata_groups:
                              type: text
                              label: PLUGIN_LOGIN_OAUTH2.USERDATA_GROUPS
                              help: PLUGIN_LOGIN_OAUTH2.USERDATA_GROUPS_HELP
                              placeholder: groups

                    generic_column_right:
                      type: column

                      fields:

                        generic.admin:
                          type: display
                          style: vertical
                          content: '<h3>Admin</h3>'

                        admin.providers.generic.enabled:
                          type: toggle
                          label: Enabled
                          highlight: 1
                          default: 0
                          options:
                            1: Enabled
                            0: Disabled
                          validate:
                            type: bool

                        admin.providers.generic.label:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.LABEL
                          help: PLUGIN_LOGIN_OAUTH2.LABEL_HELP

                        admin.providers.generic.client_id:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_ID

                        admin.providers.generic.client_secret:
                          type: text
                          label: PLUGIN_LOGIN_OAUTH2.CLIENT_SECRET

                        admin.providers.generic.authorization_endpoint:
