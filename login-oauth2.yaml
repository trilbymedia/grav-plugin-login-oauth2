enabled: true
debug: false
built_in_css: true
button_style: row
enforce_oauth2: false
require_grav_user: false
save_grav_user: false
store_provider_data: true
default_access_levels:
  access:
    site:
      login: true
default_groups:
providers:
  generic:
    enabled: true
    label: ''
    client_id: ''
    client_secret: ''
    authorization_endpoint: ''
    token_endpoint: ''
    userinfo_endpoint: ''
    enforce_email_verified: true
    verify_peer: true
    userdata_id: 'sub'
    userdata_login: 'preferred_username'
    userdata_fullname: 'name'
    userdata_email: 'email'
    userdata_email_verified: 'email_verified'
    userdata_picture: 'picture'
    avatar_from_picture: true
    group_sync: false
    userdata_groups: 'groups'
    group_filter: []
    group_prefix: ''
    group_autocreate: false
    options:
      scope: ['openid', 'email', 'profile']
      scope_separator: 'space'
      pkce_method: 'S256'

  github:
    enabled: true
    client_id: ''
    client_secret: ''
    options:
      scope: ['user:email']

  instagram:
    enabled: true
    client_id: ''
    client_secret: ''
    options:
      scope: ['basic', 'likes', 'comments']
      host: 'https://api.instagram.com'

  facebook:
    enabled: true
    app_id: ''
    app_secret: ''
    options:
      scope: ['email', 'public_profile', 'user_hometown']
      graph_api_version: 'v2.10'

  google:
    enabled: true
    client_id: ''
    client_secret: ''
    options:
      scope: ['email', 'profile']
      avatar_size: 200
      hd: '*'

  linkedin:
    enabled: true
    client_id: ''
    client_secret: ''
    options:
      scope: ['r_basicprofile','r_emailaddress']



