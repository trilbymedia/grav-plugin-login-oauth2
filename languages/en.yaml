PLUGIN_LOGIN_OAUTH2:
  GENERAL: "General"
  DOCUMENTATION: "Instructions"
  PROVIDERS: "OAuth2 Providers"
  SECTION_CALLBACKS: "Callback URIs"
  SECTION_CALLBACKS_DESC: "Enter them as redirect URIs at your identity providers."
  SECTION_BUTTONS: "Login Buttons"
  SECTION_ADMIN_BUTTONS_DESC: "Only for the classic admin, Admin2 shows its own buttons."
  SECTION_USERS: "User Accounts"
  SECTION_USERS_SHARED_DESC: "For site and admin logins."
  SECTION_DEFAULTS: "Default Permissions"
  SECTION_DEFAULTS_DESC: "Assigned at login to users without any, e.g. new users."
  SECTION_TROUBLESHOOTING: "Troubleshooting"
  SECTION_ADMIN_LOGIN: "Admin Login"
  DEBUG_HELP: "Writes details of each OAuth2 login (state, the user data from the provider) to the Grav log. They could include personal details: enable only for troubleshooting."
  BUILTIN_CSS: "Enable built-in CSS"
  BUILTIN_CSS_HELP: "If you want to provide your own custom CSS, feel free to disable the CSS provided by the plugin"
  BUTTON_STYLE: "Button Style"
  BUTTON_STYLE_HELP: "Layout of the login buttons: Horizontal Row shows full-width buttons with a small icon, Square Block tiles with a large icon above the name. Needs 'Enable built-in CSS'."
  ADMIN_BUTTON_STYLE_HELP: "Layout of the login buttons in the classic admin: Horizontal Row (full-width buttons) or Square Block (tiles with a large icon). Needs 'Enable built-in CSS'. Admin2 shows its own buttons."
  CALLBACK_PROVIDER: "Provider"
  CALLBACK_PROVIDER_HELP: "The provider to show the callback URIs for. Only for display, it isn't saved. Defaults to the first provider enabled with a client ID."
  SITE_CALLBACK_URI: "Site Callback URI"
  SITE_CALLBACK_URI_HELP: "This is the URI that the provider will call when it has authenticated the user remotely. The same for all providers."
  REQUIRE_GRAV_USER: "Require Existing Grav user (site)"
  REQUIRE_GRAV_USER_DESC: "Denies site logins of users without a Grav account; for admin logins see 'Require Existing Grav user (admin)' in the Admin tab"
  ADMIN_REQUIRE_GRAV_USER: "Require Existing Grav user (admin)"
  ADMIN_REQUIRE_GRAV_USER_HELP: "Denies admin logins of users without a Grav account, e.g. so that only accounts you created can use the admin login and no accounts are saved for others. Until set here, it follows 'Require Existing Grav user (site)'."
  SAVE_GRAV_USER: "Save Grav user (site)"
  SAVE_GRAV_USER_DESC: "Saves users logging in on the site as local Grav accounts; for admin logins see 'Save Grav user (admin)' in the Admin tab"
  ADMIN_SAVE_GRAV_USER: "Save Grav user (admin)"
  ADMIN_SAVE_GRAV_USER_HELP: "Saves users logging in to the admin as local Grav accounts, which Admin2 and admin group sync need. Saved before Grav checks access, so without 'Require Existing Grav user (admin)' also for users without admin rights. Until set here, it follows 'Save Grav user (site)'."
  STORE_OAUTH2_USER: "Store Provider data"
  STORE_OAUTH2_USER_DESC: "You can also store Provider data on the logged in user object to use in Grav"
  DEFAULT_ACCESS_LEVELS: "Default Access Levels"
  DEFAULT_ACCESS_LEVELS_HELP: "Permissions (YAML) assigned at login to users without any, e.g. new users. Applies to all providers, on site and admin logins."
  DEFAULT_ACCESS_LEVELS_DESC: "You can find more information on access levels in the [Grav Groups & Permissions](https://learn.getgrav.org/advanced/groups-and-permissions#permissions) documentation"
  CLIENT_ID: "Client ID"
  CLIENT_SECRET: "Client Secret"
  SCOPE: "Scope"
  HOST: "Host"
  APP_ID: "App ID"
  APP_SECRET: "App Secret"
  GRAPH_API_VERSION: "Graph API Version"
  AVATAR_SIZE: "Avatar Size"
  RESTRICT_DOMAIN: "Hosted Domain"
  LABEL: "Button Label"
  LABEL_HELP: "Text of the login button, e.g. the name of your identity provider"
  URL_AUTHORIZE: "Authorization URL"
  URL_ACCESS_TOKEN: "Token URL"
  URL_RESOURCE_OWNER_DETAILS: "Userinfo URL"
  URL_RESOURCE_OWNER_DETAILS_HELP: "Returns the details of the logged-in user (OpenID Connect: userinfo endpoint)"
  ENFORCE_EMAIL_VERIFIED: "Enforce Verified Email"
  ENFORCE_EMAIL_VERIFIED_HELP: "Denies the login unless the identity provider confirms the email address as verified (Email Verified Claim, in Advanced). Without it, anyone registering there with someone else's email could log in as the Grav user with that email."
  SCOPE_SEPARATOR: "Scope Separator"
  SCOPE_SEPARATOR_HELP: "Most providers expect the scopes separated by spaces (OAuth2 standard), some by commas"
  PKCE_METHOD: "PKCE Method"
  PKCE_METHOD_HELP: "Proof Key for Code Exchange protects the login against intercepted authorization codes. Use plain only if the provider supports nothing else"
  USERDATA_ID: "User ID Claim"
  USERDATA_ID_HELP: "Claim with the user's unique ID in the userinfo response (OpenID Connect: sub)"
  USERDATA_LOGIN: "Username Claim"
  USERDATA_FULLNAME: "Full Name Claim"
  USERDATA_EMAIL: "Email Claim"
  USERDATA_EMAIL_VERIFIED: "Email Verified Claim"
  USERDATA_EMAIL_VERIFIED_HELP: "Claim saying whether the email address is verified in the userinfo response (OpenID Connect: email_verified), used by 'Enforce Verified Email'"
  USERDATA_PICTURE: "Picture Claim"
  USERDATA_PICTURE_HELP: "Claim with the URL of the user's picture in the userinfo response, used by 'Avatar from Picture'"
  USERDATA_HELP: "Claim with this value in the userinfo response"
  AVATAR: "Avatar"
  AVATAR_DESC: "The user's picture from the identity provider."
  AVATAR_FROM_PICTURE: "Avatar from Picture"
  AVATAR_FROM_PICTURE_HELP: "Uses the user's picture (Picture Claim, in Advanced) as avatar in Grav. Browsers load it directly from the URL the identity provider sends, which can be on any host."
  GROUP_SYNC: "Group Sync"
  GROUP_SYNC_DESC: "Assigns users to Grav groups from the identity provider's groups on every login, before Grav checks access."
  GROUP_SYNC_ENABLED: "Sync Groups"
  GROUP_SYNC_ENABLED_HELP: "Adds the user to the matching Grav groups and removes the ones it added before; groups assigned in Grav stay. Applies at the next login. Admin logins need 'Save Grav user (admin)'."
  GROUP_SYNC_NEEDS_SAVE: "<div class=\"rounded-lg border border-amber-500/40 bg-amber-500/10 px-4 py-3 text-sm text-amber-700 dark:text-amber-300\"><strong>Group sync is disabled for admin logins.</strong> 'Save Grav user (admin)' (Admin tab) is off, so admin logins skip the sync: the new admin reads users from their account file. Turn it on to sync groups here. Until then, groups synced before, admin rights included, stay.</div>"
  USERDATA_GROUPS: "Groups Claim"
  USERDATA_GROUPS_HELP: "Claim with the user's group names in the userinfo response, used by 'Sync Groups'"
  GROUP_FILTER: "Provider Groups to Sync"
  GROUP_FILTER_HELP: "Identity provider groups to sync, by name or slug, * and ? as wildcards (e.g. grav-*). Empty: all."
  GROUP_PREFIX: "Grav Group Name Prefix"
  GROUP_PREFIX_HELP: "Prepended to the Grav group names, the provider's group names as lowercase slugs (idp_: 'Editors' becomes idp_editors). Without one, the provider can assign any existing Grav group."
  GROUP_AUTOCREATE: "Create Missing Grav Groups"
  GROUP_AUTOCREATE_HELP: "Creates them without permissions; otherwise they're skipped. Groups deleted at the provider stay in Grav."
  SECURITY: "Security"
  SECURITY_DESC: "Email verification and PKCE. The defaults are the secure choice."
  ADVANCED: "Advanced"
  ADVANCED_DESC: "Scope and the claims of the user data. The defaults fit most OpenID Connect providers."
  SITE: "Site"
  ADMIN: "Admin"
  ADMIN_ENABLED: "Enabled in Admin"
  ADMIN_ENABLED_HELP: "Offers OAuth2 login on the admin login page (Admin2 and classic admin), with the providers enabled in their Admin column (OAuth2 Providers tab)."
  ADMIN_CALLBACK_URI: "Admin Callback URI"
  ADMIN_CALLBACK_URI_HELP: "This is the URI that the provider will call after admin logins. Admin2 logins return to the API plugin, with one URI per provider; classic admin logins return to the admin path."
  DEFAULT_GROUPS: "Default Groups"
  DEFAULT_GROUPS_HELP: "Grav groups assigned at login to users without any groups, e.g. new users. Applies to all providers, on site and admin logins."
  LOGIN_MESSAGE: "Login with one of these available social accounts..."
  OR: "or"
  ERROR_EXISTING_ACCOUNT: "You have already an account using %s, please use it to login"
  ERROR_EMAIL_NOT_VERIFIED: "Your email address is not verified at the identity provider"
  ERROR_NO_ACCOUNT: "You do not have user account in the site for %s"
  OAUTH2_LOGIN_FAILED: "OAuth2 %s Login Failed: %s"
